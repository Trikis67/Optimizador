[package]
name = "optimizador"
version = "0.3.0"
description = "Optimizador para PC"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
rayon = "1"
trash = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
